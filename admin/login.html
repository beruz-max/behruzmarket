<body class="admin-body">
  <div class="login-page">
    <div class="login-card">
      <h1>BEHRUZ.DEV</h1>

          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn">LOGIN</button>
      </form>

</html>
